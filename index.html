<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>휴대폰</title>
<style>
:root{--w:402px;--glass:rgba(255,255,255,.16);--edge:rgba(255,255,255,.34)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#08090c;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR",Roboto,sans-serif;color:#fff;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;user-select:none}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* 리퀴드 글래스: 투명 + 블러 + 가장자리 빛 */
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(190%);-webkit-backdrop-filter:blur(22px) saturate(190%);border:1px solid var(--edge);box-shadow:inset 0 1.5px 0 #ffffff80,inset 0 -1px 0 #ffffff14,0 10px 30px #00000030}

#phone{position:relative;width:100%;height:100dvh;max-width:var(--w);overflow:hidden;background:#0d1226;isolation:isolate}
@media(min-width:500px){#phone{height:min(874px,94dvh);border-radius:58px;box-shadow:0 0 0 9px #101116,0 0 0 11px #3a3c45,0 40px 90px #000b}}

.wp{position:absolute;inset:0;z-index:-2;background:
 radial-gradient(85% 38% at 82% 6%,#7fd4ff,transparent 72%),
 radial-gradient(70% 40% at 8% 34%,#3b7bff,transparent 70%),
 radial-gradient(90% 45% at 100% 62%,#8a5cff,transparent 70%),
 radial-gradient(90% 40% at 12% 96%,#ff5fa8,transparent 68%),
 radial-gradient(70% 30% at 85% 100%,#ffa24d,transparent 70%),
 linear-gradient(180deg,#1b2f9a,#3a2a9e 55%,#6a2a9a);background-size:cover;background-position:center}
.dim{position:absolute;inset:0;z-index:-1;background:#00000040;opacity:0;transition:opacity .4s,backdrop-filter .4s;backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0)}
#phone.pass .dim{opacity:1;backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%)}
#phone.home .dim{opacity:.35}

.status{position:absolute;z-index:30;top:0;left:0;right:0;height:56px;padding:calc(env(safe-area-inset-top,0px) + 17px) 34px 0 40px;display:flex;justify-content:space-between;font-size:17px;font-weight:600;pointer-events:none}
.status .r{display:flex;gap:6px;align-items:center}
.island{position:absolute;z-index:31;top:calc(env(safe-area-inset-top,0px) + 11px);left:50%;width:120px;height:35px;margin-left:-60px;border-radius:20px;background:#000}
@media(max-width:499px){.island{width:104px;height:31px;margin-left:-52px}}

.screen{position:absolute;inset:0;transition:transform .55s cubic-bezier(.32,.72,0,1),opacity .4s,filter .4s}

/* 잠금화면 */
.lock{display:flex;flex-direction:column;align-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 68px);cursor:pointer;touch-action:none}
.lock .date{font-size:21px;font-weight:600;opacity:.92;letter-spacing:-.3px}
.lock .time{position:relative;display:inline-block;font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,Roboto,sans-serif;font-size:118px;font-weight:700;line-height:1;letter-spacing:-4px;margin-top:2px;font-variant-numeric:tabular-nums;
 background:linear-gradient(175deg,#ffffff94 0%,#dff1ff52 45%,#ffe2f038 75%,#ffffff6e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.6px #ffffffb8;
 filter:drop-shadow(0 1px 0 #ffffff66) drop-shadow(0 10px 22px #1a1f6045)}
.lock .time::after{content:attr(data-t);position:absolute;left:0;top:0;white-space:nowrap;-webkit-text-stroke:0;color:transparent;background:linear-gradient(110deg,transparent 36%,#ffffffd9 50%,transparent 64%);background-size:260% 100%;background-position:130% 0;-webkit-background-clip:text;background-clip:text;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,55%{background-position:130% 0}100%{background-position:-30% 0}}
@media(prefers-reduced-motion:reduce){.lock .time::after{animation:none}}
.lock .quick{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);left:46px;right:46px;display:flex;justify-content:space-between}
.quick span{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 126px);left:0;right:0;text-align:center;font-size:15px;font-weight:500;opacity:.8;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.bar{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:#fff;opacity:.92}
#phone.pass .lock{transform:scale(.96);opacity:.0;pointer-events:none}
#phone.home .lock{transform:translateY(-12%) scale(.94);opacity:0;filter:blur(14px);pointer-events:none}

/* 암호 화면 */
.pw{display:flex;flex-direction:column;align-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 96px);opacity:0;pointer-events:none;transform:translateY(28px) scale(.98)}
#phone.pass .pw{opacity:1;pointer-events:auto;transform:none}
.pw h2{margin:0;font-size:21px;font-weight:600}
.dots{display:flex;gap:22px;margin-top:30px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #ffffffd0;transition:background .12s,transform .12s}
.dots i.on{background:#fff;transform:scale(1.08)}
.dots.shake{animation:shake .45s}
@keyframes shake{15%{transform:translateX(-14px)}35%{transform:translateX(12px)}55%{transform:translateX(-9px)}75%{transform:translateX(5px)}}
.err{height:20px;margin-top:14px;font-size:14px;opacity:.9}
.pad{display:grid;grid-template-columns:repeat(3,80px);gap:16px 24px;margin-top:20px}
.k{width:80px;height:80px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .12s,transform .12s}
.k:active{background:#ffffff59;transform:scale(.94)}
.k b{font-size:35px;font-weight:400;line-height:1}
.k small{font-size:10px;letter-spacing:2px;margin-top:2px;height:11px;font-weight:700;opacity:.85}
.pw .foot{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);left:0;right:0;display:flex;justify-content:space-between;padding:0 56px;font-size:18px;font-weight:500}
@media(max-height:700px){.pw{padding-top:72px}.pad{gap:10px 22px;grid-template-columns:repeat(3,68px)}.k{width:68px;height:68px}.k b{font-size:30px}.dots{margin-top:18px}}

/* 홈 화면 */
.homes{padding:calc(env(safe-area-inset-top,0px) + 76px) 22px 0;transform:scale(1.1);opacity:0;pointer-events:none;filter:blur(10px)}
#phone.home .homes{transform:none;opacity:1;pointer-events:auto;filter:none}
.wid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
.w{height:158px;border-radius:30px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between}
.w small{font-size:13px;font-weight:600;opacity:.85}
.w .big{font-size:46px;font-weight:300;line-height:1}
.w .d{font-size:56px;font-weight:300;line-height:1}
.w .s{font-size:13px;font-weight:500;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:500;text-shadow:0 1px 4px #0005}
#phone.home .app{animation:pop .55s cubic-bezier(.34,1.4,.64,1) both;animation-delay:calc(var(--i)*22ms)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.ic{position:relative;width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;box-shadow:inset 0 1.5px 1px #ffffffa0,inset 0 -2px 3px #00000026,0 6px 14px #00000033;transition:transform .15s,filter .15s}
.ic::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#ffffff59,transparent 48%)}
.app:active .ic{transform:scale(.9);filter:brightness(.82)}
.search{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 132px);left:50%;transform:translateX(-50%);padding:9px 26px;border-radius:22px;font-size:14px;font-weight:500;display:flex;gap:7px;align-items:center}
.dock{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);left:14px;right:14px;height:96px;border-radius:38px;display:flex;justify-content:space-around;align-items:center;padding:0 8px}
.dock .app span:last-child{display:none}
.toast{position:absolute;z-index:40;top:calc(env(safe-area-inset-top,0px) + 56px);left:14px;right:14px;padding:13px 16px;border-radius:26px;font-size:14px;font-weight:500;transform:translateY(-150%);transition:transform .45s cubic-bezier(.32,.72,0,1);background:#ffffff38}
.toast.show{transform:none}
@media(prefers-reduced-motion:reduce){.screen,.toast,.dim{transition:none}.hint,.dots.shake,#phone.home .app{animation:none}}
</style>
</head>
<body>
<main id="phone">
  <div class="wp" id="wp"></div><div class="dim"></div>
  <div class="status"><span id="stime">9:41</span>
    <span class="r">
      <svg width="19" height="12" viewBox="0 0 18 12" fill="#fff"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 24 18" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M3 7a13 13 0 0 1 18 0M6.5 11a8 8 0 0 1 11 0"/><circle cx="12" cy="15.5" r="1.6" fill="#fff" stroke="none"/></svg>
      <svg width="28" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="4" fill="none" stroke="#fff" opacity=".45"/><rect x="2" y="2" width="17" height="9" rx="2.6" fill="#fff"/><rect x="24" y="4.5" width="2" height="4" rx="1" fill="#fff" opacity=".45"/></svg>
    </span></div>
  <i class="island"></i>

  <section class="screen lock" id="lock" aria-label="잠금화면">
    <div class="date" id="date"></div>
    <div class="time" id="time"></div>
    <div class="hint">위로 쓸어올려 열기</div>
    <div class="quick">
      <span class="glass" aria-label="손전등"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path fill-rule="evenodd" d="M7 2.5A.5.5 0 0 1 7.5 2h9a.5.5 0 0 1 .5.5v3.7c0 .5-.2 1-.6 1.4L15 9v11.2a1.8 1.8 0 0 1-1.8 1.8h-2.4A1.8 1.8 0 0 1 9 20.2V9L7.6 7.6A2 2 0 0 1 7 6.2zM10.8 12.7a1.2 1.2 0 0 1 2.4 0v1.6a1.2 1.2 0 0 1-2.4 0z"/></svg></span>
      <span class="glass" aria-label="카메라"><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path fill-rule="evenodd" d="M9.2 4h5.6l1.2 2h2.7A2.3 2.3 0 0 1 21 8.3v9.4a2.3 2.3 0 0 1-2.3 2.3H5.3A2.3 2.3 0 0 1 3 17.7V8.3A2.3 2.3 0 0 1 5.3 6H8zM12 8.7a4.1 4.1 0 1 0 0 8.2 4.1 4.1 0 0 0 0-8.2z"/><circle cx="12" cy="12.8" r="2.2"/></svg></span>
    </div>
    <div class="bar"></div>
  </section>

  <section class="screen pw" id="pw" aria-label="암호 입력">
    <h2>암호 입력</h2>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="err" id="err" role="status"></div>
    <div class="pad" id="pad"></div>
    <div class="foot"><button id="emg">긴급상황</button><button id="cancel">취소</button></div>
  </section>

  <section class="screen homes" id="homes" aria-label="홈 화면">
    <div class="wid">
      <div class="w glass"><small id="wloc"></small><div><div class="big" id="wt"></div><div class="s" id="ws"></div></div></div>
      <div class="w glass"><small id="wday"></small><div><div class="d" id="wd"></div><div class="s">오늘 일정 없음</div></div></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="search glass"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>검색</div>
    <nav class="dock glass" id="dock"></nav>
    <button class="bar" id="relock" aria-label="잠금화면으로 돌아가기"></button>
  </section>
  <div class="toast glass" id="toast" role="status"></div>
</main>

<script>
/* ===== 설정: 여기만 바꾸면 됩니다 ===== */
const CFG={
  pin:'0913',            // 비밀번호 (4자리)
  now:null,              // 폰 속 시각 고정 예) '2026-09-13T19:00:00+09:00' / null 이면 실제 시각
  wallpaper:'wallpaper.png',        // 배경 사진 경로 예) 'wallpaper.jpg' (없으면 그라데이션)
  weather:{loc:'서울',t:'31°',s:'맑음'},
  apps:[                 // [이름, 이모지, 배경색]
    ['메시지','💬','linear-gradient(#5be26a,#1fb83b)'],['카카오톡','🗨️','#fee500'],['Instagram','📷','linear-gradient(45deg,#f9a03f,#e1306c 55%,#833ab4)'],['사진','🌸','#fff'],
    ['캘린더','📅','#fff'],['메모','📝','linear-gradient(#ffe36a,#ffc933)'],['음악','🎵','linear-gradient(#ff5f7a,#e0264b)'],['지도','🗺️','linear-gradient(#7be08a,#4aa8ff)'],
    ['시계','⏰','#16171b'],['지갑','💳','linear-gradient(#2b2d33,#0f1013)'],['설정','⚙️','linear-gradient(#c5c8d0,#868a95)'],['App Store','🅰️','linear-gradient(#4ab2ff,#1a6df0)']],
  dock:[['전화','📞','linear-gradient(#5be26a,#1fb83b)'],['Safari','🧭','linear-gradient(#5db7ff,#2a7de1)'],['메시지','💬','linear-gradient(#5be26a,#1fb83b)'],['음악','🎵','linear-gradient(#ff5f7a,#e0264b)']]
};

const $=s=>document.querySelector(s),phone=$('#phone');
let pin='',busy=false,sy=null;

const t0=Date.now(),base=CFG.now?Date.parse(CFG.now):null,TZ={timeZone:'Asia/Seoul'};
const now=()=>base?new Date(base+Date.now()-t0):new Date();
function tick(){const d=now();
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{...TZ,hour:'numeric',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).map(x=>[x.type,x.value]));
  const t=`${+p.hour}:${p.minute}`;$('#time').textContent=$('#time').dataset.t=t;$('#stime').textContent=t;
  $('#date').textContent=d.toLocaleDateString('ko-KR',{...TZ,month:'long',day:'numeric',weekday:'long'});
  $('#wday').textContent=d.toLocaleDateString('ko-KR',{...TZ,weekday:'long'});
  $('#wd').textContent=d.toLocaleDateString('ko-KR',{...TZ,day:'numeric'}).replace('일','')}
tick();setInterval(tick,5000);
$('#wloc').textContent=CFG.weather.loc;$('#wt').textContent=CFG.weather.t;$('#ws').textContent=CFG.weather.s;
if(CFG.wallpaper)$('#wp').style.cssText=`background-image:url("${CFG.wallpaper}");background-size:cover;background-position:center;background-color:#1b1b1d`;

const LET={2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'};
$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,''].map(n=>n===''?'<span></span>':`<button class="k glass" data-n="${n}" aria-label="${n}"><b>${n}</b><small>${LET[n]||''}</small></button>`).join('');
let ix=0;const icon=([n,e,bg])=>`<button class="app" style="--i:${ix++}" data-app="${n}"><span class="ic" style="background:${bg}">${e}</span><span>${n}</span></button>`;
$('#grid').innerHTML=CFG.apps.map(icon).join('');$('#dock').innerHTML=CFG.dock.map(icon).join('');

const buzz=n=>navigator.vibrate&&navigator.vibrate(n);
function openPass(){if(!phone.classList.contains('home'))phone.classList.add('pass')}
function closePass(){phone.classList.remove('pass');setPin('')}
function setPin(v){pin=v;document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<pin.length));$('#cancel').textContent=pin?'삭제':'취소'}
function press(n){if(busy||pin.length>=4)return;buzz(8);setPin(pin+n);$('#err').textContent='';if(pin.length===4){busy=true;setTimeout(check,180)}}
function check(){
  if(pin===CFG.pin){phone.classList.remove('pass');phone.classList.add('home');setTimeout(()=>{setPin('');busy=false},450)}
  else{const d=$('#dots');d.classList.add('shake');$('#err').textContent='암호가 올바르지 않습니다. 다시 입력하세요.';buzz(120);
    setTimeout(()=>{d.classList.remove('shake');setPin('');busy=false},460)}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.id);toast.id=setTimeout(()=>e.classList.remove('show'),1800)}

$('#pad').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(b)press(b.dataset.n)});
$('#cancel').addEventListener('click',()=>pin?setPin(pin.slice(0,-1)):closePass());
$('#emg').addEventListener('click',()=>toast('긴급 전화는 지원하지 않습니다'));
$('#lock').addEventListener('click',openPass);
$('#lock').addEventListener('pointerdown',e=>{sy=e.clientY});
$('#lock').addEventListener('pointerup',e=>{if(sy!=null&&sy-e.clientY>50)openPass();sy=null});
$('#relock').addEventListener('click',()=>{phone.classList.remove('home','pass');busy=false;setPin('')});
$('#homes').addEventListener('click',e=>{const a=e.target.closest('[data-app]');if(a)toast(`‘${a.dataset.app}’은(는) 아직 준비 중이에요`)});
document.addEventListener('keydown',e=>{
  const c=phone.classList;
  if(!c.contains('pass')&&!c.contains('home')&&(e.key==='Enter'||e.key===' '||/^\d$/.test(e.key))){openPass();if(/^\d$/.test(e.key))press(e.key);return}
  if(!c.contains('pass'))return;
  if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')setPin(pin.slice(0,-1));else if(e.key==='Escape')closePass()});
</script>
</body>
</html>
